<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>

    <style>
        table {
            border: 1px solid black;
            border-collapse: collapse;
            width: 400px;
        }

        td {
            border: 1px solid black;
            padding: 5px;

        }

        .n1 {
            background-color: #ff0202;
        }

        td.n2 {
            background-color: #02ff02;
        }

        .n3 {
            background-color: #0202ff;
        }

    </style>
</head>
<body>
    <h1>Minha Tabela</h1>
    <!-- Tabela com cabeçalho e corpo 
    HIERARQUIA DE TABELA:
    TABLE Início da tabela
    TABLE ROW <tr> Início da linha
        TABLE HEADER <th> Cabeçalho da tabela
        TABLE DATA <td> Dados da tabela 
    -->

    <table>
        <tr>
            <td class="n1">A1</td>
            <td class="n2">B1</td>
            <td class="n3">C1</td>
        </tr>

        <tr>
            <td class="n1">A2</td>
            <td class="n2">B2</td>
            <td class="n3">C2</td>
        </tr>

        <tr>
            <td class="n1">A3</td>
            <td class="n2">B3</td>
            <td class="n3">C3</td>
        </tr>

        <tr>
            <td class="n1">A4</td>
            <td class="n2">B4</td>
            <td class="n3">C4</td>
        </tr>
    </table>
</body>
</html>
